name: Generate photo list

on:
  push:
    branches:
      - main
    paths:
      - "Images/mavver/**"
      - ".github/workflows/generate-photos.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate photos.json
        shell: python
        run: |
          import json
          from pathlib import Path

          folder = Path("Images/mavver")

          extensions = {
              ".jpg",
              ".jpeg",
              ".png",
              ".webp",
              ".gif",
              ".avif"
          }

          photos = sorted(
              file.name
              for file in folder.iterdir()
              if file.is_file()
              and file.suffix.lower() in extensions
          )

          Path("photos.json").write_text(
              json.dumps(
                  photos,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print(f"Found {len(photos)} photos")

      - name: Commit photos.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add photos.json

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update photo list"
          git push
